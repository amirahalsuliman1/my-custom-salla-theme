# T-1.07 — lint and build on every PR.
#
# Separate from the upstream `lint-pr.yaml`, which validates PR titles and branch
# names through Salla's own actions. That file is upstream's and is left alone;
# this one is the theme's.
name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # lint:changed diffs against the merge base, so the history has to be here.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # package.json's engines field is a range (^22.18 || >=24.11), which
          # setup-node cannot resolve. Pinned to the upper branch of that range.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ratcheted: only the files this PR touches. scripts/lint-changed.mjs
      # explains why, and the number that forces it.
      - name: Lint changed files
        run: node scripts/lint-changed.mjs ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      # Every template, every run — not the changed ones. A `.twig` syntax error
      # is what made Salla's own Twilight CI report `twig_result: null` across
      # nine commits with no line number to act on; scripts/lint-twig.php has the
      # full account. Placed before the build because it is the cheapest step
      # here and the one whose failure is most specific.
      - name: Install Twig lexer
        run: composer install --working-dir=scripts/twig-lint --no-interaction --no-progress

      - name: Check Twig syntax
        run: pnpm run lint:twig

      # The catalogue is validated as a pair on every run, not only when touched:
      # a key can be orphaned by a change to the template that consumed it.
      - name: Check locale catalogues
        run: pnpm run lint:locales

      # Whole-repo, every run, for the same reason as the locale catalogues: both
      # of these are cross-file rules that a changed-files ratchet cannot see. An
      # image loses its reserved box when the *stylesheet* holding its
      # aspect-ratio changes, and a contrast pair breaks when a token moves in
      # 01-settings — neither edit touches the template that fails.
      #
      # ⚠ `lint:images` was added here by T-8.06, not T-8.02. That task made the
      # image rules a check that can fail, but wired it only into `pnpm lint`,
      # which nothing in CI runs — so the check could not actually fail a build.
      # One line, fixed in passing, and recorded rather than slipped in.
      - name: Check image rules
        run: pnpm run lint:images

      # T-8.06. Roughly a third of WCAG — the part visible in markup and in the
      # token layer. The keyboard, screen-reader and RTL focus-order passes are
      # /docs/MANUAL-QA.md section 2 and no runner can perform them.
      - name: Check accessibility rules
        run: pnpm run lint:a11y

      # T-1.09. Every test, every run — the suite is small and fast, and it is
      # the only step here that executes the theme's own JavaScript rather than
      # reading it. Placed before the build because a failure names a behaviour;
      # a build failure after it would name a bundle.
      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run production

      # Byte budgets only — LCP, INP, CLS and WCAG conformance need a rendered
      # storefront with real products and merchant settings, which a runner
      # building a theme package does not have. /docs/BUDGETS.md section 4 names
      # the task that carries each of those instead.
      - name: Check byte budgets
        run: pnpm run check:budgets
